name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BOX64_REPOSITORY: https://github.com/ptitSeb/box64.git
      BOX64_REF: 9d0e5b1c0a3a8def60e63bdbda37ac9617d17bcb
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 5 -type f -name sdkmanager | sort | tail -n1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          SDK_PACKAGES=(
            "platform-tools"
            "platforms;android-35"
            "build-tools;35.0.0"
            "ndk;27.2.12479018"
            "cmake;3.22.1"
          )
          verify_sdk_packages() {
            [[ -x "$SDK_ROOT/platform-tools/adb" ]] &&
            [[ -f "$SDK_ROOT/platforms/android-35/android.jar" ]] &&
            [[ -x "$SDK_ROOT/build-tools/35.0.0/aapt" ]] &&
            [[ -x "$SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]] &&
            [[ -x "$SDK_ROOT/cmake/3.22.1/bin/cmake" ]]
          }

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

          for attempt in 1 2 3; do
            echo "Installing Android SDK packages (attempt $attempt/3)."
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" "${SDK_PACKAGES[@]}" && verify_sdk_packages; then
              echo "Android SDK package installation and critical-tool verification passed."
              exit 0
            fi

            echo "::warning::Android SDK installation or verification failed on attempt $attempt/3."
            # sdkmanager can leave a partially extracted directory after a transient
            # archive/channel read error. Remove only the affected package when its
            # required executable is absent; preserve complete installations and all
            # unrelated SDK components.
            if [[ -d "$SDK_ROOT/ndk/27.2.12479018" ]] &&
               [[ ! -x "$SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]]; then
              rm -rf "$SDK_ROOT/ndk/27.2.12479018"
            fi
            if [[ -d "$SDK_ROOT/cmake/3.22.1" ]] &&
               [[ ! -x "$SDK_ROOT/cmake/3.22.1/bin/cmake" ]]; then
              rm -rf "$SDK_ROOT/cmake/3.22.1"
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 10))"
            fi
          done

          echo "::error::Android SDK packages could not be installed and verified after 3 attempts."
          exit 1
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix
      - name: Validate runtime and Box64 build scripts
        run: |
          bash -n scripts/package_runtime_bundle.sh
          bash -n scripts/build_box64_android.sh
      - name: Verify MO2X protocol layout
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror native/wine-xinput/layout_test.cpp -I native/wine-xinput -o /tmp/mo2x-layout-test
          /tmp/mo2x-layout-test
      - name: Build Wine XInput DLLs
        run: |
          set -euo pipefail
          chmod +x native/wine-xinput/build_wine_xinput.sh
          MINGW_CC=x86_64-w64-mingw32-gcc-posix native/wine-xinput/build_wine_xinput.sh native/wine-xinput/out
      - name: Package XInput DLLs as app assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/runtime
          cp native/wine-xinput/out/xinput1_3.dll app/src/main/assets/runtime/
          cp native/wine-xinput/out/xinput1_4.dll app/src/main/assets/runtime/
          cp native/wine-xinput/out/xinput9_1_0.dll app/src/main/assets/runtime/

          LLVM_READOBJ="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj"
          test -x "$LLVM_READOBJ"

          # XInputGetStateEx is intentionally NONAME at ordinal 100.
          # Validate COFF export ordinal/name fields independently instead of
          # assuming the symbol appears in objdump's ordinal/name-pointer table.
          has_export() {
            local dll="$1" ordinal="$2" expected_name="$3"
            "$LLVM_READOBJ" --coff-exports "$dll" | awk \
              -v expected_ordinal="$ordinal" -v expected_name="$expected_name" '
                /^[[:space:]]*Export \\{/ { in_export=1; ordinal=""; name="" }
                in_export && /Ordinal:/ { ordinal=$2 }
                in_export && /Name:/ { name=$2; gsub(/["]/, "", name) }
                in_export && /^[[:space:]]*}/ {
                  if (ordinal == expected_ordinal &&
                      (expected_name == "*" || name == expected_name)) found=1
                  in_export=0
                }
                END { exit !found }
              '
          }

          for dll in xinput1_3.dll xinput1_4.dll xinput9_1_0.dll; do
            asset="app/src/main/assets/runtime/$dll"
            test -s "$asset"
            cmp "native/wine-xinput/out/$dll" "$asset"
            EXPORTS="$("$LLVM_READOBJ" --coff-exports "native/wine-xinput/out/$dll")"
            for symbol in XInputGetState XInputSetState XInputGetCapabilities XInputEnable XInputGetBatteryInformation XInputGetKeystroke; do
              grep -Fq "Name: $symbol" <<<"$EXPORTS"
            done
            has_export "native/wine-xinput/out/$dll" 100 "*"
            has_export "native/wine-xinput/out/$dll" 101 "XInputWaitForGuideButton"
            has_export "native/wine-xinput/out/$dll" 102 "XInputCancelGuideButton"
            has_export "native/wine-xinput/out/$dll" 103 "XInputPowerOffController"
          done
      - name: Build and package Box64 native executable
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_box64_android.sh "$RUNNER_TEMP/box64"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0755 "$RUNNER_TEMP/box64/libbox64.so" app/src/main/jniLibs/arm64-v8a/libbox64.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libbox64.so | grep -Eq 'Machine:.*AArch64'
          test -s app/src/main/jniLibs/arm64-v8a/libbox64.so
          echo "Box64 LOAD segment alignment:"
          readelf -Wl app/src/main/jniLibs/arm64-v8a/libbox64.so | awk '/LOAD/{print "  " $NF; if ($NF != "0x4000") {print "ERROR: expected 0x4000, got " $NF > "/dev/stderr"; exit 1} found=1} END{if (!found) {print "ERROR: no LOAD segments found" > "/dev/stderr"; exit 1}}'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify packaged APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          MANIFEST_DUMP="$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump xmltree "$APK_PATH" AndroidManifest.xml)"
          grep -F "extractNativeLibs" <<<"$MANIFEST_DUMP" | grep -Eq "(0xffffffff|true)"
          grep -F "largeHeap" <<<"$MANIFEST_DUMP" | grep -Eq "(0xffffffff|true)"
          grep -F "targetSdkVersion" <<<"$MANIFEST_DUMP" | grep -Eq "(0x23|35)"
          unzip -l "$APK_PATH" | grep -F "lib/arm64-v8a/libbox64.so"
          unzip -lv "$APK_PATH" | grep -F "lib/arm64-v8a/libbox64.so" | grep -Eq "Defl:N"
          mkdir -p "$RUNNER_TEMP/apk-native"
          for so in libbox64.so libmo2_input_bridge.so libvulkan_probe.so; do
            unzip -p "$APK_PATH" "lib/arm64-v8a/$so" > "$RUNNER_TEMP/apk-native/$so"
            file "$RUNNER_TEMP/apk-native/$so" | grep -F "ELF 64-bit LSB"
            readelf -h "$RUNNER_TEMP/apk-native/$so" | grep -Eq "Class:.*ELF64"
            readelf -h "$RUNNER_TEMP/apk-native/$so" | grep -Eq "Machine:.*AArch64"
            readelf -Wl "$RUNNER_TEMP/apk-native/$so" | awk -v name="$so" '/LOAD/{if ($NF != "0x4000") {print "Bad 16 KB LOAD alignment in " name ": " $NF; exit 1} found=1} END{if (!found) exit 1}'
          done
          cmp "$RUNNER_TEMP/apk-native/libbox64.so" app/src/main/jniLibs/arm64-v8a/libbox64.so
          unzip -l "$APK_PATH" | grep -F "lib/arm64-v8a/libvulkan_probe.so"
          unzip -l "$APK_PATH" | grep -F "lib/arm64-v8a/libmo2_input_bridge.so"
          unzip -l "$APK_PATH" | grep -F "assets/runtime/xinput1_3.dll"
          unzip -l "$APK_PATH" | grep -F "assets/runtime/xinput1_4.dll"
          unzip -l "$APK_PATH" | grep -F "assets/runtime/xinput9_1_0.dll"
          unzip -l "$APK_PATH" | grep -F "mipmap-anydpi-v26/ic_launcher.xml"
          unzip -l "$APK_PATH" | grep -F "mipmap-anydpi-v26/ic_launcher_round.xml"
      - name: Upload APK and XInput DLLs
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: moving-out-2-android-alpha
          path: |
            app/build/outputs/apk/debug/*.apk
            native/wine-xinput/out/*.dll
          retention-days: 14

name: Publish Moving Out 2 Android Pre-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.3.0-alpha.*"

permissions:
  contents: write

concurrency:
  group: moving-out-2-prerelease
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort | tail -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix

      - name: Build bundled XInput compatibility DLLs
        run: |
          set -euo pipefail
          chmod +x native/wine-xinput/build_wine_xinput.sh
          MINGW_CC=x86_64-w64-mingw32-gcc-posix native/wine-xinput/build_wine_xinput.sh native/wine-xinput/out
          mkdir -p app/src/main/assets/runtime
          cp native/wine-xinput/out/xinput1_3.dll app/src/main/assets/runtime/
          cp native/wine-xinput/out/xinput1_4.dll app/src/main/assets/runtime/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -F "drawable-nodpi/ic_launcher_logo.png"
          unzip -l "$APK" | grep -F "mipmap-anydpi-v26/ic_launcher.xml"
          unzip -l "$APK" | grep -F "assets/runtime/xinput1_3.dll"
          unzip -l "$APK" | grep -F "assets/runtime/xinput1_4.dll"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-alpha.1
          name: Moving Out 2 Android v0.3.0-alpha.1
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

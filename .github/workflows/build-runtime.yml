name: Build Runtime Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-runtime.yml"
      - ".github/workflows/publish-apk-prerelease.yml"
      - "scripts/**"
      - "native/wine-xinput/**"
      - "app/src/main/java/com/dnctf/movingout2/runtime/**"
      - "app/src/test/java/com/dnctf/movingout2/runtime/**"
      - "app/src/main/java/com/dnctf/movingout2/**"
      - "app/src/test/java/com/dnctf/movingout2/**"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/cpp/**"
  workflow_dispatch:
    inputs:
      dxvk_url:
        description: "Verified DXVK release archive URL (x64 package)"
        required: false
        default: "https://github.com/doitsujin/dxvk/releases/download/v3.1.1/dxvk-3.1.1.tar.gz"
        type: string
      dxvk_sha256:
        description: "Expected SHA-256 of the DXVK archive"
        required: false
        default: "40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608"
        type: string
      bundle_version:
        description: "Runtime bundle version"
        required: false
        default: "0.1.1"
        type: string

permissions:
  contents: read

concurrency:
  group: build-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-runtime:
    name: Build and audit standalone runtime
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_PLATFORM: "android-28"
      BOX64_REPOSITORY: "https://github.com/ptitSeb/box64.git"
      BOX64_REF: "9d0e5b1c0a3a8def60e63bdbda37ac9617d17bcb"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 5 -type f -name sdkmanager | sort | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          test -x "$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"

      - name: Install build and audit dependencies
        run: |
          sudo dpkg --add-architecture amd64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates unzip zip file binutils llvm jq \
            gcc-mingw-w64-x86-64-posix shellcheck python3-yaml wine64 libwine:amd64

      - name: Validate YAML and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path(".github/workflows").glob("*.y*ml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"YAML OK: {path}")
          PY
          find scripts native -type f -name '*.sh' -print0 | while IFS= read -r -d '' script; do bash -n "$script"; done
          find scripts native -type f -name '*.sh' -print0 | xargs -0 shellcheck
          python3 -m unittest discover -s scripts/tests -v

      - name: Build Wine XInput bridge
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/wine-xinput/build_wine_xinput.sh
          MINGW_CC=x86_64-w64-mingw32-gcc-posix native/wine-xinput/build_wine_xinput.sh "$RUNNER_TEMP/xinput"
          test -s "$RUNNER_TEMP/xinput/xinput1_3.dll"
          test -s "$RUNNER_TEMP/xinput/xinput1_4.dll"
          test -s "$RUNNER_TEMP/xinput/xinput9_1_0.dll"
          for dll in xinput1_3.dll xinput1_4.dll xinput9_1_0.dll; do
            objdump -p "$RUNNER_TEMP/xinput/$dll" | grep -Eq '\[[[:space:]]*100\]'
            objdump -p "$RUNNER_TEMP/xinput/$dll" | grep -Eq '\[[[:space:]]*101\]'
            objdump -p "$RUNNER_TEMP/xinput/$dll" | grep -Eq '\[[[:space:]]*102\]'
            objdump -p "$RUNNER_TEMP/xinput/$dll" | grep -Eq '\[[[:space:]]*103\]'
          done

      - name: Build Box64 for standalone Android API 28
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_box64_android.sh
          scripts/build_box64_android.sh "$RUNNER_TEMP/runtime-input/box64"
          BOX64_BIN="$RUNNER_TEMP/runtime-input/box64/libbox64.so"
          test -s "$BOX64_BIN"
          readelf -sW "$BOX64_BIN" | awk '$4 == "FUNC" && $8 == "my___libc_start_main" { found=1 } END { exit !found }'
          if strings "$BOX64_BIN" | grep -Fq "/data/data/com.termux"; then
            echo "::error::Standalone Box64 binary embeds a Termux private path."
            exit 1
          fi
          readelf -Wl "$BOX64_BIN" | awk '/LOAD/{print "  " $NF; if ($NF != "0x4000") {print "ERROR: Box64 LOAD alignment is not 16 KB: " $NF > "/dev/stderr"; exit 1} found=1} END{if (!found) {print "ERROR: Box64 has no LOAD segments" > "/dev/stderr"; exit 1}}'
          mkdir -p "$RUNNER_TEMP/runtime-input/box64"
          install -m 0755 "$BOX64_BIN" "$RUNNER_TEMP/runtime-input/box64/box64"

      - name: Stage signed Ubuntu Wine x86_64 runtime
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu's /usr/bin/wine64-stable is a shell wrapper. The actual
          # Wine 11 x86_64 ELF launcher is installed as /usr/lib/.../wine/wine.
          find_wine_elf() {
            local candidates="$1"
            local path resolved header
            while IFS= read -r path; do
              [[ -n "$path" && -e "$path" ]] || continue
              resolved="$(readlink -f "$path")"
              [[ -x "$resolved" && -s "$resolved" ]] || continue
              if ! header="$(readelf -h "$resolved" 2>/dev/null)"; then
                continue
              fi
              if grep -Eq 'Class:.*ELF64' <<<"$header" &&
                 grep -Eqi 'Machine:.*(Advanced Micro Devices X86-64|X86-64)' <<<"$header"; then
                printf '%s\n' "$resolved"
                return 0
              fi
            done <<<"$candidates"
            return 1
          }
          PACKAGE_PATHS="$(dpkg-query -L wine64 libwine:amd64)"
          LIBRARY_PATHS="$(find -L /usr/lib /usr/libexec -type f \( -name 'wine' -o -name 'wine64' -o -name 'wine64-preloader' -o -name 'wine64-stable' -o -name 'wineserver' -o -name 'wineserver-stable' \) -print 2>/dev/null || true)"
          ALL_WINE_PATHS="$(printf '%s\n%s\n' "$PACKAGE_PATHS" "$LIBRARY_PATHS" | sort -u)"
          WINE64_CANDIDATES="$(grep -E '/(wine|wine64|wine64-preloader|wine64-stable)$' <<<"$ALL_WINE_PATHS" || true)"
          WINESERVER_CANDIDATES="$(grep -E '/(wineserver|wineserver-stable)$' <<<"$ALL_WINE_PATHS" || true)"
          WINE64="$(find_wine_elf "$WINE64_CANDIDATES" || true)"
          WINESERVER="$(find_wine_elf "$WINESERVER_CANDIDATES" || true)"
          if [[ -z "$WINE64" || -z "$WINESERVER" ]]; then
            echo "::error::Could not locate real Wine x86_64 ELF launchers."
            for candidate in $WINE64_CANDIDATES $WINESERVER_CANDIDATES; do
              resolved="$(readlink -f "$candidate" 2>/dev/null || printf '%s' "$candidate")"
              echo "Candidate: $candidate -> $resolved"
              file "$resolved" || true
              readelf -h "$resolved" 2>&1 | grep -E 'Class:|Machine:|Error:' || true
            done
            echo "Wine executable files discovered under /usr/lib:"
            find -L /usr/lib /usr/libexec -type f \( -name 'wine*' -o -name 'wineserver*' \) -print 2>/dev/null | head -100 || true
            exit 1
          fi
          WINE_LIB_DIR="/usr/lib/x86_64-linux-gnu/wine"
          [[ -d "$WINE_LIB_DIR" ]]
          mkdir -p "$RUNNER_TEMP/runtime-input/wine/bin" "$RUNNER_TEMP/runtime-input/wine/lib"
          install -m 0755 "$WINE64" "$RUNNER_TEMP/runtime-input/wine/bin/wine64"
          install -m 0755 "$WINESERVER" "$RUNNER_TEMP/runtime-input/wine/bin/wineserver"
          cp -aL "$WINE_LIB_DIR" "$RUNNER_TEMP/runtime-input/wine/lib/wine"
          # Stage the guest glibc loader closure required by Ubuntu x86_64 Wine.
          GUEST_GLIBC_DIR="$RUNNER_TEMP/runtime-input/wine/lib/x86_64-linux-gnu"
          mkdir -p "$GUEST_GLIBC_DIR"
          REQUIRED_GLIBC=(libc.so.6 libm.so.6 libdl.so.2 libpthread.so.0 librt.so.1 libresolv.so.2 libgcc_s.so.1 ld-linux-x86-64.so.2)
          for name in "${REQUIRED_GLIBC[@]}"; do
            source="/lib/x86_64-linux-gnu/$name"
            [[ -e "$source" ]] || source="/usr/lib/x86_64-linux-gnu/$name"
            [[ -e "$source" ]] || { echo "::error::Required guest glibc object missing: $name"; exit 1; }
            cp -aL "$source" "$GUEST_GLIBC_DIR/$name"
          done
          # Include every additional direct DT_NEEDED dependency reported by ldd.
          for binary in "$WINE64" "$WINESERVER"; do
            LDD_OUTPUT="$(ldd "$binary")"
            printf '%s\n' "$LDD_OUTPUT" | tee "$RUNNER_TEMP/ldd-$(basename "$binary").txt"
            if grep -q "not found" <<<"$LDD_OUTPUT"; then
              echo "::error::Unresolved DT_NEEDED dependency for $binary"
              exit 1
            fi
            while IFS= read -r dependency; do
              [[ -n "$dependency" && -f "$dependency" ]] || continue
              cp -aL "$dependency" "$GUEST_GLIBC_DIR/$(basename "$dependency")"
            done < <(printf '%s\n' "$LDD_OUTPUT" | awk '/=> \/[^ ]+/ {print $3} /^\// {print $1}' | sort -u)
          done
          for library in "$GUEST_GLIBC_DIR"/*.so*; do
            [[ -f "$library" && ! -L "$library" ]] || { echo "::error::Guest glibc object is not a regular file: $library"; exit 1; }
            readelf -h "$library" | grep -Eq 'Class:.*ELF64'
            readelf -h "$library" | grep -Eqi 'Machine:.*(Advanced Micro Devices X86-64|X86-64)'
            readelf -h "$library" | grep -Eq 'Type:.*DYN'
          done
          if find "$RUNNER_TEMP/runtime-input/wine/lib" -type l -print -quit | grep -q .; then echo "::error::Symlink found in staged Wine libraries."; exit 1; fi
          find -L "$RUNNER_TEMP/runtime-input/wine/lib/wine" -type f -name '*.so*' -print -quit | grep -q .
          echo "Resolved Wine ELF launchers:"
          readelf -h "$WINE64" | grep -E 'Class:|Machine:'
          readelf -h "$WINESERVER" | grep -E 'Class:|Machine:'
          echo "Wine source: Ubuntu signed apt packages wine64 + libwine:amd64"
          dpkg-query -W -f='${Package}=${Version}\n' wine64 libwine:amd64 | tee "$RUNNER_TEMP/wine-package-versions.txt"

      - name: Download and verify DXVK release
        shell: bash
        env:
          DXVK_URL: ${{ inputs.dxvk_url || 'https://github.com/doitsujin/dxvk/releases/download/v3.1.1/dxvk-3.1.1.tar.gz' }}
          DXVK_SHA256: ${{ inputs.dxvk_sha256 || '40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608' }}
        run: |
          set -euo pipefail
          if [[ -z "$DXVK_URL" || ! "$DXVK_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "::error::A DXVK release URL and its independently verified 64-character SHA-256 are required. Supply them via workflow_dispatch."
            exit 2
          fi
          curl --fail --location --retry 3 --retry-all-errors "$DXVK_URL" -o "$RUNNER_TEMP/dxvk.tar.gz"
          printf '%s  %s\n' "$DXVK_SHA256" "$RUNNER_TEMP/dxvk.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/dxvk-extract" "$RUNNER_TEMP/runtime-input/dxvk/x64"
          tar -xzf "$RUNNER_TEMP/dxvk.tar.gz" -C "$RUNNER_TEMP/dxvk-extract"
          D3D11="$(find "$RUNNER_TEMP/dxvk-extract" -type f -path '*/x64/d3d11.dll' -print -quit)"
          DXGI="$(find "$RUNNER_TEMP/dxvk-extract" -type f -path '*/x64/dxgi.dll' -print -quit)"
          [[ -s "$D3D11" && -s "$DXGI" ]]
          install -m 0644 "$D3D11" "$RUNNER_TEMP/runtime-input/dxvk/x64/d3d11.dll"
          install -m 0644 "$DXGI" "$RUNNER_TEMP/runtime-input/dxvk/x64/dxgi.dll"

      - name: Audit all runtime binary ABIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-input/xinput"
          cp "$RUNNER_TEMP/xinput/"*.dll "$RUNNER_TEMP/runtime-input/xinput/"
          WINE_DIR="$RUNNER_TEMP/runtime-input/wine"
          DXVK_DIR="$RUNNER_TEMP/runtime-input/dxvk/x64"
          XINPUT_DIR="$RUNNER_TEMP/runtime-input/xinput"
          BOX64="$RUNNER_TEMP/runtime-input/box64/box64"
          readelf -h "$BOX64" | grep -Eq 'Class:.*ELF64'
          readelf -h "$BOX64" | grep -Eq 'Machine:.*AArch64'
          echo "Box64 LOAD segment alignment:"
          readelf -Wl "$BOX64" | awk '/LOAD/{print "  " $NF; if ($NF != "0x4000") {print "ERROR: Box64 LOAD alignment is not 16 KB: " $NF > "/dev/stderr"; exit 1} found=1} END{if (!found) {print "ERROR: Box64 has no LOAD segments" > "/dev/stderr"; exit 1}}'
          for f in "$WINE_DIR/bin/wine64" "$WINE_DIR/bin/wineserver"; do
            echo "Checking Wine ELF: $f"
            readelf -h "$f" | grep -E 'Class:|Machine:'
            readelf -h "$f" | grep -Eq 'Class:.*ELF64'
            readelf -h "$f" | grep -Eqi 'Machine:.*(Advanced Micro Devices X86-64|X86-64)'
          done
          find "$WINE_DIR/lib/x86_64-linux-gnu" -type f -name '*.so*' -print0 | while IFS= read -r -d '' f; do
            readelf -h "$f" | grep -Eq 'Class:.*ELF64'
            readelf -h "$f" | grep -Eqi 'Machine:.*(Advanced Micro Devices X86-64|X86-64)'
            readelf -h "$f" | grep -Eq 'Type:.*DYN'
          done
          [[ -s "$WINE_DIR/lib/x86_64-linux-gnu/libc.so.6" ]]
          if find "$WINE_DIR/lib" -type l -print -quit | grep -q .; then
            echo "::error::Symlink found under staged wine/lib."
            exit 1
          fi
          find -L "$WINE_DIR/lib/wine" -type f -name '*.so*' -print0 | while IFS= read -r -d '' f; do
            echo "Checking Wine shared object: $f"
            readelf -h "$f" | grep -E 'Class:|Type:|Machine:'
            readelf -h "$f" | grep -Eq 'Class:.*ELF64'
            readelf -h "$f" | grep -Eqi 'Machine:.*(Advanced Micro Devices X86-64|X86-64)'
            readelf -h "$f" | grep -Eq 'Type:.*DYN'
          done
          for f in "$DXVK_DIR/d3d11.dll" "$DXVK_DIR/dxgi.dll" "$XINPUT_DIR/xinput1_3.dll" "$XINPUT_DIR/xinput1_4.dll" "$XINPUT_DIR/xinput9_1_0.dll"; do
            echo "Checking PE32+ x86_64: $f"
            objdump -f "$f" | grep 'architecture:'
            objdump -p "$f" | grep -Ei 'Magic[[:space:]]+'
            objdump -f "$f" | grep -q 'architecture: i386:x86-64'
            objdump -p "$f" | grep -Eqi 'Magic[[:space:]]+020b'
          done

      - name: Package runtime manifest v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          scripts/package_runtime_bundle.sh \
            --box64 "$RUNNER_TEMP/runtime-input/box64/box64" \
            --wine-dir "$RUNNER_TEMP/runtime-input/wine" \
            --dxvk-dir "$RUNNER_TEMP/runtime-input/dxvk/x64" \
            --xinput-dir "$RUNNER_TEMP/runtime-input/xinput" \
            --bundle-version "${{ inputs.bundle_version || '0.1.1' }}" \
            --output "dist/moving-out-2-runtime-arm64-v8a.zip"
          test -s dist/SHA256SUMS.txt
          sha256sum dist/moving-out-2-runtime-arm64-v8a.zip > dist/moving-out-2-runtime-arm64-v8a.zip.sha256
          (cd dist && sha256sum --check SHA256SUMS.txt)
          sha256sum --check dist/moving-out-2-runtime-arm64-v8a.zip.sha256
          mkdir -p "$RUNNER_TEMP/runtime-audit"
          unzip -q dist/*.zip -d "$RUNNER_TEMP/runtime-audit"
          scripts/audit_runtime_bundle.sh "$RUNNER_TEMP/runtime-audit" "dist/moving-out-2-runtime-arm64-v8a.zip"
          unzip -p dist/moving-out-2-runtime-arm64-v8a.zip runtime-manifest.json | python3 -m json.tool > /dev/null
          cp "$RUNNER_TEMP/wine-package-versions.txt" dist/
          cat dist/SHA256SUMS.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Run Kotlin unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload runtime bundle and provenance
        uses: actions/upload-artifact@v6
        with:
          name: moving-out-2-runtime-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/SHA256SUMS.txt
            dist/wine-package-versions.txt
          if-no-files-found: error
          retention-days: 30

      # Runtime remains a short-lived Actions artifact only. This workflow never creates
      # GitHub Releases or Git tags; public publishing is disabled during runtime validation.

name: Publish Integrated Android APK Pre-Release
on:
  workflow_run:
    workflows: ["Build Runtime Bundle"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: android-integrated-prerelease
  cancel-in-progress: false
jobs:
  build-and-publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download runtime artifact from successful runtime build
        uses: actions/download-artifact@v6
        with:
          name: moving-out-2-runtime-${{ github.event.workflow_run.run_number }}
          path: runtime-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify runtime archive
        run: |
          set -euo pipefail
          test -s runtime-artifact/moving-out-2-runtime-arm64-v8a.zip
          test -s runtime-artifact/moving-out-2-runtime-arm64-v8a.zip.sha256
          EXPECTED_SHA="$(awk '{print $1}' runtime-artifact/moving-out-2-runtime-arm64-v8a.zip.sha256)"
          printf '%s  %s\n' "$EXPECTED_SHA" runtime-artifact/moving-out-2-runtime-arm64-v8a.zip | sha256sum --check
          unzip -p runtime-artifact/moving-out-2-runtime-arm64-v8a.zip runtime-manifest.json | python3 -m json.tool >/dev/null
          unzip -t runtime-artifact/moving-out-2-runtime-arm64-v8a.zip >/dev/null
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Stage Box64 as an APK native executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          BOX64_LIB="app/src/main/jniLibs/arm64-v8a/libbox64.so"
          unzip -p runtime-artifact/moving-out-2-runtime-arm64-v8a.zip box64/bin/box64 > "$BOX64_LIB"
          chmod 0755 "$BOX64_LIB"
          test -s "$BOX64_LIB"
          readelf -h "$BOX64_LIB" | grep -Eq 'Class:.*ELF64'
          readelf -h "$BOX64_LIB" | grep -Eq 'Machine:.*AArch64'
          readelf -h "$BOX64_LIB" | grep -Eq 'Type:.*DYN'
          cmp "$BOX64_LIB" <(unzip -p runtime-artifact/moving-out-2-runtime-arm64-v8a.zip box64/bin/box64)
          echo "APK Box64 payload: $BOX64_LIB"
          sha256sum "$BOX64_LIB"
      - name: Build XInput assets
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix
          chmod +x native/wine-xinput/build_wine_xinput.sh
          MINGW_CC=x86_64-w64-mingw32-gcc-posix native/wine-xinput/build_wine_xinput.sh native/wine-xinput/out
          mkdir -p app/src/main/assets/runtime
          cp native/wine-xinput/out/xinput1_3.dll native/wine-xinput/out/xinput1_4.dll app/src/main/assets/runtime/
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Unit tests and release APK
        run: |
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon assembleRelease
      - name: Verify APK, sign and checksums
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK="release-output/Moving-Out-2-Android-v${{ steps.version.outputs.version }}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp runtime-artifact/moving-out-2-runtime-arm64-v8a.zip release-output/
          (cd release-output && sha256sum moving-out-2-runtime-arm64-v8a.zip > moving-out-2-runtime-arm64-v8a.zip.sha256)
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" >/dev/null
          cmp <(unzip -p "$APK" lib/arm64-v8a/libbox64.so) app/src/main/jniLibs/arm64-v8a/libbox64.so
          MANIFEST_DUMP="$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml)"
          printf '%s\n' "$MANIFEST_DUMP" | grep -i "extractNativeLibs" || true
          # AGP 8 synthesizes extractNativeLibs from useLegacyPackaging; verify the
          # actual APK stores the native executable compressed for PackageManager extraction.
          unzip -lv "$APK" | grep -F "lib/arm64-v8a/libbox64.so" | grep -Eq 'Defl:N'
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libvulkan_probe.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libbox64.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libmo2_input_bridge.so"
          unzip -l "$APK" | grep -F "assets/runtime/xinput1_3.dll"
          unzip -l "$APK" | grep -F "assets/runtime/xinput1_4.dll"
          (cd release-output && sha256sum "Moving-Out-2-Android-v${{ steps.version.outputs.version }}-arm64-v8a.apk" moving-out-2-runtime-arm64-v8a.zip > SHA256SUMS.txt)
          (cd release-output && sha256sum --check SHA256SUMS.txt)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - name: Remove obsolete releases and Git tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          retry_gh_api() {
            local attempt=1 output
            while (( attempt <= 5 )); do
              if output="$(gh api "$@" 2>&1)"; then
                [[ -n "$output" ]] && printf '%s\n' "$output"
                return 0
              fi
              if [[ "$output" == *"HTTP 404"* || "$output" == *"Not Found"* || "$output" == *"Reference does not exist"* ]]; then
                echo "Already deleted; treating as success: $*"
                return 0
              fi
              echo "GitHub API attempt $attempt/5 failed: $output" >&2
              if (( attempt < 5 )); then sleep $((attempt * 3)); fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          echo "Removing all prior releases and tags before publishing the new integrated release."
          release_rows="$(retry_gh_api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | "\(.id)|\(.tag_name)"')"
          while IFS='|' read -r release_id tag; do
            [[ -n "$release_id" ]] || continue
            echo "Deleting obsolete release: $tag (ID $release_id)"
            retry_gh_api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done <<< "$release_rows"

          tag_rows="$(retry_gh_api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --paginate --jq '.[].ref')"
          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            [[ -n "$tag" ]] || continue
            echo "Deleting obsolete Git tag: $tag"
            retry_gh_api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done <<< "$tag_rows"

      - name: Publish single integrated pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH" release-output/moving-out-2-runtime-arm64-v8a.zip release-output/moving-out-2-runtime-arm64-v8a.zip.sha256 release-output/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --prerelease \
            --title "Moving Out 2 Android $RELEASE_VERSION (Integrated Pre-release)" \
            --notes "Install the APK, connect to the internet, and launch. The app downloads and validates the matching runtime from this same release. Import your own legally obtained game files. Alpha APK uses an ephemeral CI debug signing key; uninstall an older build if Android rejects an update. No game files are included. Physical-device launch and graphics compatibility still require testing."
      - uses: actions/upload-artifact@v6
        with:
          name: moving-out-2-android-integrated-release
          path: release-output/*
          retention-days: 30

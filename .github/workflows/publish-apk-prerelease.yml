name: Publish Android APK Pre-Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App pre-release version (without app-v prefix)"
        required: true
        default: "0.2.0-alpha.2"
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-prerelease
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, verify and publish ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::Invalid version: $INPUT_VERSION"
            exit 1
          }
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 5 -type f -name sdkmanager | sort | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix

      - name: Build XInput DLL assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/wine-xinput/build_wine_xinput.sh
          MINGW_CC=x86_64-w64-mingw32-gcc-posix native/wine-xinput/build_wine_xinput.sh native/wine-xinput/out
          mkdir -p app/src/main/assets/runtime
          cp native/wine-xinput/out/xinput1_3.dll app/src/main/assets/runtime/
          cp native/wine-xinput/out/xinput1_4.dll app/src/main/assets/runtime/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p release-output
          cp "$APK" "release-output/Moving-Out-2-Android-${{ steps.version.outputs.version }}-arm64-v8a-unsigned.apk"
          APK_OUT="$(find release-output -maxdepth 1 -name '*.apk' -print -quit)"
          sha256sum "$APK_OUT" > release-output/SHA256SUMS.txt
          unzip -t "$APK_OUT"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/android/sdk}}/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_OUT"
          unzip -l "$APK_OUT" | grep -F "lib/arm64-v8a/libvulkan_probe.so"
          unzip -l "$APK_OUT" | grep -F "lib/arm64-v8a/libmo2_input_bridge.so"
          unzip -l "$APK_OUT" | grep -F "assets/runtime/xinput1_3.dll"
          unzip -l "$APK_OUT" | grep -F "assets/runtime/xinput1_4.dll"
          echo "APK_PATH=$APK_OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            release-output/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Moving Out 2 Android $RELEASE_VERSION (Pre-release)" \
            --prerelease \
            --notes-file - <<EOF
          ## Moving Out 2 Android — $RELEASE_VERSION

          **Channel:** Early access / pre-release  
          **Platform:** Android ARM64 (arm64-v8a)  
          **Minimum Android:** Android 8.0 (API 26)  
          **Target SDK:** Android 15 (API 35)  
          **Build:** Release variant, debug-key signed APK (alpha/testing only)

          ### Included
          - Android launcher and game library/import workflow.
          - Box64/Wine runtime integration and runtime bundle downloader.
          - Vulkan native probe and SurfaceView presentation bridge.
          - XInput 1.3 / 1.4 bridge assets.
          - Touch controller and physical gamepad input integration.
          - Runtime settings and telemetry overlay.

          ### Installation
          1. Download the APK asset below.
          2. Verify it with the SHA256SUMS.txt file. The APK signature is checked by CI using apksigner.
          3. Enable installation from this source when Android prompts.
          4. Install the APK.
          5. Import the separately distributed runtime bundle from the app's runtime setup flow.
          6. Import your own legally obtained Moving Out 2 Windows game files.

          ### Important limitations
          - This alpha APK is signed with the CI-generated Android debug key so Android Package Installer can install it. The key is ephemeral per fresh CI runner; a later build may require uninstalling this version before upgrading. A persistent private release keystore is required for stable in-place updates.
          - No Moving Out 2 game files are included.
          - Automated CI verifies compilation, packaging and unit tests. Actual launch, Vulkan presentation, compatibility and FPS still require physical-device testing.
          - Runtime bundle is distributed separately: https://github.com/$GITHUB_REPOSITORY/releases/tag/runtime-v0.1.0-23

          ### Verification
          SHA-256 is provided in `SHA256SUMS.txt`. Verify before installation.

          **Not affiliated with Team17 or SMG Studio.**
          EOF

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v6
        with:
          name: moving-out-2-android-release-apk
          path: release-output/*
          retention-days: 30
